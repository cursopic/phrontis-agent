name: gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -count=1 ./...
      # helm is preinstalled on ubuntu-latest.
      - name: helm lint and template
        run: |
          set_args=(--set api.url=https://api.example.com --set api.key=k)
          helm lint deploy/helm/phrontis-agent "${set_args[@]}"
          helm template r deploy/helm/phrontis-agent "${set_args[@]}" >/dev/null
          if helm template r deploy/helm/phrontis-agent --set api.key=k >/dev/null 2>&1; then echo "api.url must be required"; exit 1; fi
