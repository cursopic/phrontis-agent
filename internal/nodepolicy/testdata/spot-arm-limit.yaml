apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: phrontis
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 1m
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: "16"
  template:
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: phrontis
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - m7g
            - c7g
            - m6i
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
            - arm64
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
  weight: 1
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: phrontis-spot
spec:
  disruption:
    budgets:
      - nodes: 10%
    consolidateAfter: 1m
    consolidationPolicy: WhenEmptyOrUnderutilized
  limits:
    cpu: "16"
  template:
    spec:
      expireAfter: Never
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: phrontis
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - m7g
            - c7g
            - m6i
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
            - arm64
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
      taints:
        - effect: NoSchedule
          key: karpenter.sh/capacity-type
          value: spot
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: phrontis
spec:
  amiSelectorTerms:
    - alias: bottlerocket@v1.10.0
  role: KarpenterNodeRole-prod-eu
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod-eu
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: prod-eu
