image:
  repository: ghcr.io/cursopic/phrontis-agent
  tag: ""                 # empty = the chart appVersion
  pullPolicy: IfNotPresent

api:
  url: ""                 # required: the API base URL, your Phrontis API URL
  # The cluster key. Prefer existingSecret so the key stays out of values files.
  key: ""
  existingSecret: ""      # name of a Secret in the release namespace that holds the key
  existingSecretKey: key

every: 60s                # time between samples

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
