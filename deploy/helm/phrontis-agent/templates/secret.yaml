{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "phrontis-agent.secret" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "phrontis-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.existingSecretKey }}: {{ required "set api.key, or api.existingSecret" .Values.api.key | quote }}
{{- end }}
